[package]
name = "openpresenter"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Vincent <vincentzhangz@outlook.com>"]
license = "Apache-2.0"
repository = "https://github.com/vincentzhangz/openpresenter"
homepage = "https://github.com/vincentzhangz/openpresenter"
description = "Modern open-source live presentation software built in Rust"

[features]
default = ["ndi-sdk"]
ndi-sdk = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "7"
env_logger = "0.11"
ffmpeg-next = "9"
futures = "0.3"
glyphon = "0.12"
gpui-kit = "0.9"
image = "0.25"
log = "0.4"
lru = "0.19"
midir = "0.11"
pollster = "1.0"
quick-xml = "0.42.0"
rfd = "0.18"
rodio = { version = "0.23", default-features = false, features = [
    "playback",
    "mp3",
    "wav",
    "flac",
    "vorbis",
    "mp4",
] }
rosc = "0.11"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tower = "0.5"
uuid = { version = "1.29", features = ["v4", "serde"] }
wgpu = "30"
zip = { version = "9", features = ["deflate"] }

[build-dependencies]
bindgen = "0.73"

[dev-dependencies]
gpui-kit = { version = "0.9", features = ["test-support"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[package.metadata.bundle]
name = "OpenPresenter"
identifier = "com.openpresenter.app"
version = "0.1.0"
category = "Productivity"
short_description = "Live presentation software"
long_description = "Modern open-source live presentation software built in Rust"
copyright = "2026 Vincent and the OpenPresenter Contributors"
osx_minimum_system_version = "12.0"
