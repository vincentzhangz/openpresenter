name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CACHE_VERSION: v5

jobs:
  # ── Format (platform-independent, run once) ────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # ── Clippy (all platforms) ─────────────────────────────────────────────────
  clippy:
    name: Clippy (${{ matrix.os }})
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libavcodec-dev libavdevice-dev libavfilter-dev \
            libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libclang-dev \
            libasound2-dev
          for lib in libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale; do
            sudo ln -sf /usr/include/x86_64-linux-gnu/$lib /usr/include/$lib
          done

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "FFMPEG_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-${{ runner.os }}-cargo-clippy-
            ${{ env.CACHE_VERSION }}-${{ runner.os }}-cargo-

      - name: Clippy (warnings-as-errors, no NDI SDK)
        run: cargo clippy --no-default-features -- -D warnings

  # ── Tests (all platforms) ──────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libavcodec-dev libavdevice-dev libavfilter-dev \
            libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libclang-dev \
            libasound2-dev
          for lib in libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale; do
            sudo ln -sf /usr/include/x86_64-linux-gnu/$lib /usr/include/$lib
          done

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "FFMPEG_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-${{ runner.os }}-cargo-test-
            ${{ env.CACHE_VERSION }}-${{ runner.os }}-cargo-

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      - name: Run tests with coverage (no NDI SDK)
        run: cargo llvm-cov nextest --no-default-features --profile ci --ignore-filename-regex "src[/\\]ui" --lcov --output-path lcov.info

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: lcov.info
          retention-days: 7

      - name: Update test and coverage badges
        if: always() && runner.os == 'macOS' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: gaelgirodon/ci-badges-action@v1
        with:
          gist-id: 98482a1448f7b055a193c05f9acf683b
          token: ${{ secrets.GIST_TOKEN }}

  # ── Build (all platforms) ──────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libavcodec-dev libavdevice-dev libavfilter-dev \
            libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libclang-dev \
            libasound2-dev
          for lib in libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale; do
            sudo ln -sf /usr/include/x86_64-linux-gnu/$lib /usr/include/$lib
          done

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "FFMPEG_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-${{ runner.os }}-cargo-build-
            ${{ env.CACHE_VERSION }}-${{ runner.os }}-cargo-

      - name: Build release (no NDI SDK)
        run: cargo build --release --no-default-features

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: openpresenter-${{ matrix.os }}
          path: |
            target/release/openpresenter
            target/release/openpresenter.exe
          retention-days: 14
          if-no-files-found: ignore
